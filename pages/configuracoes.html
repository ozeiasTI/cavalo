<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações</title>
  <link rel="stylesheet" href="../css/padrao.css" />
  <link rel="stylesheet" href="../css/formulario.css" />
  <link rel="shortcut icon" href="../img/cavalo.png" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <main>
    <div id="instrucoes">
      <h2>Configurações <i class="fa-solid fa-gear"></i></h2>

      <div class="comojogar">
        <p>Aqui você poderá definir seu <strong>nome</strong>, bem como escolher o nivel de
          <strong>dificuldade</strong>.
        </p>
        <div class="formulario">

          <dib class="bloco">
            <label>Nome:</label>
            <input type="text" id="nome" />
          </dib>

          <div class="bloco">
            <label>Nivel:</label>
            <select id="nivel">
              <option value="6">Fácil</option>
              <option value="7">Médio</option>
              <option value="8">Difícil</option>
            </select>
          </div>
        </div>

        <p>Aproveite para definir o <strong>Volume</strong> do seu jogo.</p>

        <div class="bloco">
          <input type="range" id="volume" min="0" max="100" value="50">
        </div>

        <p>Você poderá <strong>apagar todo o Histórico</strong> clicando aqui: <input type="submit" onclick="apagar()"
            value="Apagar"></p>

        <div class="centro">
          <button onclick="voltar()">
            <i class="fa-solid fa-arrow-left"></i> Voltar
          </button>
          <button onclick="historico()">
            <i class="fa-solid fa-hard-drive"></i> Histórico
          </button>

          <button onclick="salvar()"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../js/configuracoes.js"></script>
</body>

</html>
